# Default training configuration. Override any field from the CLI, e.g.:
#   python train.py --config configs/default.yaml --model-name retinanet --epochs 20
data_root: processed
test_root: processed/test
model_name: resnet50_fpn   # one of src.model.MODEL_REGISTRY
common_size_width: 1024
common_size_height: 1024
batch_size: 16
val_batch_size: 32
num_epochs: 15
learning_rate: 0.005
momentum: 0.9
weight_decay: 0.0005
train_val_split: 0.8
num_workers: 2
seed: 42
device: null                # null -> auto-detect cuda/cpu
output_dir: outputs
use_augmentation: true
